# Secrets manifest — labels and descriptions ONLY. Never a value.
#
# Naming convention: <project-slug>-<service>-<purpose>, or harness-<purpose>
# for secrets the harness itself owns (not tied to any one project).
#
# To store a value: security add-generic-password -a "$USER" -s "<label>" -w
# To retrieve one (from inside a script only): Scripts/harness/secure/get_secret.sh <label>

secrets: []

# Example entry, for reference — copy this shape when you add a real one:
#
# secrets:
#   - label: harness-github-pat
#     description: "Personal access token for pushing this repo to GitHub"
#     project: harness
#     scopes: ["repo"]
#     rotation: "manual, no fixed cadence"
